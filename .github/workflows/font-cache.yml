# 给 ci.yml 的「Install CJK fonts」预热 .deb 缓存。
# PR 只能读到自己或目标分支(staging/main)的缓存,而 CI 只在 PR 上跑 → 必须在分支上各存一份。
# 本文件合入 staging / main 时各跑一次;缓存被逐出(7 天无人读)后 CI 会回落到在线下载,手动 Run workflow 可补。
name: Warm font cache

on:
  push:
    branches: [staging, main]
    paths: [.github/workflows/font-cache.yml]
  workflow_dispatch:

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/cache@v4
        with:
          path: ~/apt-fonts
          key: apt-fonts-noto-${{ runner.os }}-v1
      - name: Download font debs
        run: |
          ls ~/apt-fonts/*.deb >/dev/null 2>&1 && exit 0
          APT="-o Acquire::Retries=5 -o Acquire::http::Timeout=60"
          sudo apt-get $APT update
          mkdir -p ~/apt-fonts && cd ~/apt-fonts
          apt-get $APT download fonts-noto-cjk fonts-noto-core fonts-noto-mono
          ls -la
