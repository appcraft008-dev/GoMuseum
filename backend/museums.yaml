# 馆配置：加一个馆 = 加一段
museums:
  orsay:
    name_zh: 奥赛博物馆
    name_en: Musée d'Orsay
    city_zh: 巴黎
    city_en: Paris
    country: FR
    wikidata_qid: Q23402
    category_filter: Q3305213   # 主类目(兜底)
    # 四大类(通用分类法映射见 category_config.CATEGORY_BY_QID):
    # 绘画+壁画 / 雕塑+雕像+半身像+小像 / 纸上(素描水彩色粉版画习作草图) / 摄影
    categories: [Q3305213, Q219423,
                 Q860861, Q179700, Q241045, Q1066288,
                 Q93184, Q18761202, Q12043905, Q15123870, Q2647254, Q5078274,
                 Q125191]
    country_lang: fr
    sources: [joconde, wikipedia]   # 每馆补充源；Wikidata 是脊柱不在此列
    joconde_museum: "musée d'Orsay"   # JocondeCatalog 补纸上作品(Wikidata 覆盖偏科)
    fetch_limit: 12000              # 全条目5353+多P31重复行(P18已OPTIONAL,无图件也收)
    sample_size: 30
    sample_qids: []
  orangerie:
    name_zh: 橘园美术馆
    name_en: Musée de l'Orangerie
    city_zh: 巴黎
    city_en: Paris
    country: FR
    wikidata_qid: Q726781
    category_filter: Q3305213
    categories: [Q3305213, Q219423,
                 Q860861, Q179700, Q241045, Q1066288,
                 Q93184, Q18761202, Q12043905, Q15123870, Q2647254, Q5078274,
                 Q125191]
    country_lang: fr
    sources: [joconde, wikipedia]
    joconde_museum: "musée de l'Orangerie des Tuileries"
    fetch_limit: 500
    sample_size: 10
    sample_qids: []
  louvre:
    name_zh: 卢浮宫
    name_en: Louvre Museum
    city_zh: 巴黎
    city_en: Paris
    country: FR
    wikidata_qid: Q19675
    # 12部门+馆本体直挂(WDQS 实测 2026-07-21,合计~18.5k件);馆身份仍 Q19675
    collection_qids: [Q19675, Q3044768, Q3044772, Q3044751, Q3044747,
                      Q3044749, Q3044767, Q3044748, Q3044753,
                      Q106349126, Q121354106, Q683074, Q106824040]
    category_filter: Q3305213
    categories: [Q3305213, Q219423,
                 Q860861, Q179700, Q241045, Q1066288,
                 Q93184, Q18761202, Q12043905, Q15123870, Q2647254, Q5078274,
                 Q125191]
    country_lang: fr
    sources: [wikipedia]        # v1 不碰 Joconde 142k(留给 Meilisearch 换代)
    collect_all_types: true     # 百科式大馆:整部门全收(古物/装饰艺术 P31 长尾不可枚举)
    fetch_limit: 40000          # 18.5k 条目 × 多 P31 重复行余量
    sample_size: 30
    sample_qids: []
  petit_palais:
    name_zh: 小皇宫美术馆
    name_en: Petit Palais
    city_zh: 巴黎
    city_en: Paris
    country: FR
    # ⚠️ 馆的正式名是「musée des Beaux-Arts de la ville de Paris」,Petit Palais 是
    # 它所在的建筑(P276)。按纪律①核验过:P195 直挂本馆 2186 幅绘画,不是部门制,
    # 所以不需要 collection_qids。
    wikidata_qid: Q59546080
    category_filter: Q3305213
    # 四大类 + 本馆特有:圣像画(60 件有图)与三种版画(17 件)
    categories: [Q3305213, Q219423,
                 Q860861, Q179700, Q241045, Q1066288,
                 Q93184, Q18761202, Q12043905, Q15123870, Q2647254, Q5078274,
                 Q125191,
                 Q132137, Q18218093, Q11060274, Q18219090]
    country_lang: fr
    # Joconde 现状不可用(API 返回 HTML);且本馆是**市立**馆,本就未必在其收录范围。
    sources: [wikipedia]
    fetch_limit: 8000           # WDQS 实测约 3.7k 条目 × 多 P31 重复行余量
    sample_size: 20
    sample_qids: []
