# 馆配置：加一个馆 = 加一段
#
# `rank` = 探索页馆序(小→大)，**rank 最小的那个上大卡**。这是编辑决策，
# 不是可计算的量：别拿 popularity 排(prod 里 77% 的记录是 0，等于在噪声里排)，
# 也别拿 artwork_count 排(那是数据导入进度，不是值得逛的程度)。
# 加新馆时**必须显式给 rank**——不给会落到末尾，而不会悄悄顶掉现有的首位。
#
# `names` = 馆名的**其余八语**。zh 和 en 仍在 name_zh / name_en（那两个是
# onboard 管线写进 DB 的列），所以每种语言只有一处定义，不会两边漂移。
# 没有 names 之前，非中文界面一律吃 name_en —— 法语用户看到的是 "Louvre Museum"，
# 而隔壁三个馆的 name_en 恰好是法语拼写，于是看起来像"只有卢浮宫漏译"。
# 取值来自 Wikidata 标签，但**不是照抄**，三处按显示场景调整过：
#   ① 法语标签按维基惯例小写开头(`musée du Louvre`)，这里是卡片标题位 → 首字大写；
#   ② de/pl 标签用弯撇号 U+2019 → 统一成 ASCII `'`，与既有 name_en 一致；
#   ③ 小皇宫的馆本体标签是法律全名(`musée des Beaux-Arts de la ville de Paris`)，
#      游客认的是建筑名 → 取建筑条目 Q820892 的标签(十语齐全，且与 name_en 相同)。
