  rijksmuseum:
    # ⚠️ 跨城市扩展的**隐身演练**馆(spec 2026-09-28-multi-city-expansion §五)。
    # 目录插入后 published_at 为 NULL = 普通用户看不见;只有 can_preview 账号可见。
    # 放出前置:nl_pass_7d 在 Play 生效且 PASSES 里 on_sale=True(onboard_verify ⑧)。
    rank: 5
    # 官网(Wikidata P856,2026-10-22 查)。网站馆页「开放时间与门票以官网为准」链到这里
