title: "파리 미술관·박물관 자주 묻는 질문: 휴관일, 입장권, 파리 뮤지엄 패스, 공휴일"
intro: "파리의 루브르 박물관, 오르세 미술관, 오랑주리 미술관, 프티 팔레를 찾는 분들을 위한 간단명료한 답변입니다. 휴관일, 예약, 무료 입장, 파리 뮤지엄 패스(Paris Museum Pass), 오디오 가이드, 공휴일 개관을 다룹니다. 모든 답변에 공식 출처와 확인 날짜를 표시했습니다."
groups:
  plan: 관람 계획
  tickets: 입장권, 무료 입장, 파리 뮤지엄 패스
  museums: 관람 규칙
  holidays: 공휴일, 파업, 휴관
items:
  closed-days:
    q: 파리의 각 미술관·박물관은 무슨 요일에 쉬나요?
    a:
      louvre: "파리 {louvre}은 매주 화요일 휴관입니다. 1월 1일, 5월 1일, 12월 25일에도 휴관하며, 그 밖의 공휴일은 화요일과 겹치지 않으면 문을 엽니다."
      orsay: "파리 {orsay}은 매주 월요일 휴관입니다. 5월 1일과 12월 25일에도 휴관합니다."
      orangerie: "파리 {orangerie}은 매주 화요일 휴관입니다. 5월 1일, 12월 25일, 7월 14일 오전에도 휴관합니다."
      petit_palais: "파리 {petit_palais}는 매주 월요일 휴관입니다. 1월 1일, 5월 1일, 7월 14일, 11월 11일, 12월 25일에도 휴관합니다."
  louvre-booking:
    q: "{louvre}은 미리 입장 시간을 예약해야 하나요?"
    a: "파리 {louvre}은 무료 입장 대상자를 포함한 모든 관람객에게 입장 시간 예약을 권장합니다.\n\n매우 붐비는 시기에는 모든 관람객의 예약을 의무화하기도 하며, 2026년 10월 17일부터 11월 1일까지가 그랬습니다. 방문 전 공식 사이트의 운영 시간 페이지를 확인하세요."
  louvre-night:
    q: "{louvre}은 어느 요일 저녁에 늦게까지 열고, 몇 시까지인가요?"
    a: "파리 {louvre}은 수요일과 금요일에 21:00까지 엽니다.\n\n다른 개관일(월·목·토·일)에는 18:00에 문을 닫습니다. 마지막 입장은 폐관 1시간 전이고, 폐관 30분 전부터 전시실을 비우기 시작합니다."
  louvre-time:
    q: "{louvre} 관람에는 얼마나 걸리나요? 2~3시간밖에 없다면?"
    a: "파리 {louvre}의 공식 코스 '루브르의 걸작'은 약 90분이 걸립니다.\n\n2~3시간밖에 없다면 이 코스를 먼저 돌고, 남은 시간은 관심 있는 전시관(윙) 하나에 쓰세요."
  louvre-orsay-one-day:
    q: "{louvre}과 {orsay}을 하루에 같이 볼 수 있나요?"
    a: "네. 파리 {louvre}과 {orsay}은 둘 다 수·목·금·토·일요일에 문을 엽니다. {louvre}은 화요일, {orsay}은 월요일 휴관입니다.\n\n목요일이 가장 좋습니다. 이날 {orsay}이 21:45까지 열기 때문에(마지막 입장 21:00), 낮에는 09:00에 여는 {louvre}을, 저녁에는 {orsay}을 볼 수 있습니다. 수요일과 금요일은 반대로 {louvre}이 21:00까지 엽니다."
  orangerie-water-lilies:
    q: "모네의 '수련'은 {orangerie} 어디에 있나요?"
    a: "파리 {orangerie}에 있는 모네의 '수련'(Nymphéas)은 이어진 두 개의 타원형 전시실을 채우고 있으며, 유리 지붕으로 들어오는 자연광을 받습니다.\n\n대형 작품 8점은 1927년 모네 자신의 구상대로 설치되었습니다. 첫 번째 방은 아침부터 저녁까지 물에 비친 하늘과 식물을, 두 번째 방은 물가를 감싼 버드나무 가지를 보여 줍니다."
  museum-pass:
    q: 파리 뮤지엄 패스는 무엇이고, 루브르·오르세·오랑주리에서 쓸 수 있나요?
    a: "파리 뮤지엄 패스는 파리와 근교의 미술관·박물관·기념물 50곳 이상에 한 번씩 입장할 수 있는 패스로, {louvre}, {orsay}, {orangerie}, 개선문이 포함됩니다. {petit_palais}는 목록에 없지만 상설 전시는 원래 무료입니다.\n\n가격은 2일권 85유로, 4일권 105유로, 6일권 125유로입니다. 기간은 첫 입장 시각부터 시간 단위(48·96·144시간)로 계산하며, 특별전은 포함되지 않습니다. 18세 미만과 26세 미만 EU 거주자는 대부분의 장소가 무료라 보통 패스가 필요 없습니다.\n\nGoMuseum의 파리 패스는 이와 다릅니다. GoMuseum 앱의 오디오 가이드만 열어 주며, 미술관·박물관 입장권은 포함되지 않습니다."
  museum-pass-louvre-entry:
    q: "파리 뮤지엄 패스가 있으면 예약 없이 {louvre}에 들어갈 수 있나요?"
    a: "보장되지 않습니다. 파리 뮤지엄 패스로 파리 {louvre} 입장이 보장되는 것은 입장 시간을 예약한 경우뿐입니다.\n\n예약은 무료이며 파리 뮤지엄 패스 공식 사이트에서 합니다. 예약 없이 줄을 서 볼 수는 있지만, 붐비는 시기에는 매우 오래 걸리거나 입장하지 못할 수도 있습니다. {orsay}도 패스 소지자에게 같은 공식 사이트에서 시간 예약을 요구합니다."
  free-entry:
    q: 파리의 미술관·박물관에 무료로 들어갈 수 있는 사람은?
    a:
      louvre: "파리 {louvre}은 18세 미만 모두와 26세 미만 유럽경제지역(EEA) 거주자가 무료이며, 사진이 있는 신분증이 필요합니다(거주자는 90일 넘게 거주했다는 증명도 필요)."
      orsay: "파리 {orsay}은 18세 미만 모두와 26세 미만 유럽경제지역(EEA) 거주자가 무료입니다."
      orangerie: "파리 {orangerie}은 18세 미만 모두가 무료이며, EU 시민이거나 EU에 3개월 넘게 거주한 18~25세도 신분 증명을 하면 무료입니다."
      petit_palais: "파리 {petit_palais}의 상설 전시는 누구나 무료이며 예약도 필요 없습니다. 특별전은 유료입니다."
  first-sunday:
    q: 파리의 미술관·박물관은 매달 첫째 일요일에 무료인가요?
    a:
      louvre: "아니요, 파리 {louvre}은 첫째 일요일에 무료가 아닙니다. 매달 첫째 금요일 18:00 이후(7월·8월 제외)와 7월 14일에 모두 무료입니다."
      orsay: "네, 파리 {orsay}은 매달 첫째 일요일에 모두 무료이지만, 입장 시간을 미리 예약해야 합니다."
      orangerie: "네, 파리 {orangerie}은 매달 첫째 일요일에 모두 무료이며, 입장 시간 예약이 필수입니다."
      petit_palais: "파리 {petit_palais}의 상설 전시는 개관일이면 언제나 무료라 특정한 날을 기다릴 필요가 없습니다."
  petit-palais-ticket:
    q: "{petit_palais}는 입장권이 필요한가요?"
    a: "아니요. 파리 {petit_palais}의 상설 전시는 무료이며 예약도 필요 없습니다.\n\n유료는 특별전뿐이며, 예약이 강력히 권장됩니다. 운영 시간은 화요일~일요일 10:00~18:00이고, 금요일과 토요일 저녁에는 특별전만 20:00까지 엽니다."
  must-see:
    q: 파리 각 미술관·박물관에서 놓치지 말아야 할 것은?
    a:
      louvre: "{louvre}에는 약 90분짜리 공식 코스 '루브르의 걸작'이 있습니다. 저희 {louvre} 필수 관람 목록은 이 공식 코스를 따릅니다."
      orsay: "{orsay}은 1848년부터 1914년까지의 미술을 다루며, 안내 데스크에서 출발하는 걸작 가이드 투어를 운영합니다. 저희 {orsay} 필수 관람 목록은 GoMuseum에서 해설을 읽고 들을 수 있는 작품을 보여 줍니다."
      orangerie: "{orangerie}에서 가장 놓치지 말아야 할 것은 모네의 '수련'입니다. 대형 작품 8점이 모네의 구상대로 두 개의 타원형 전시실에 걸려 있습니다."
      petit_palais: "{petit_palais}는 무료 관람 앱을 제공하며, 걸작 12점 코스와 필수 작품 30점 코스가 있습니다."
  audio-guides:
    q: 파리 각 미술관·박물관의 오디오 가이드는 어떤 것이 있나요?
    a:
      louvre: "파리 {louvre}은 피라미드 아래 카운터에서 오디오 가이드를 6유로에 대여하며, 입장권과 함께 온라인으로 예약할 수도 있습니다. 걸작 150점 이상을 다루고 9개 언어로 제공됩니다."
      orsay: "파리 {orsay}은 현장에서 오디오 가이드를 6유로(할인 4유로)에 대여하며, 300개 이상의 해설을 10개 언어로 들을 수 있습니다. 휴대폰에 내려받는 버전은 진행 중인 주요 특별전만 다룹니다."
      orangerie: "파리 {orangerie}은 현장에서 오디오 가이드를 대여하며, 상설 전시와 '수련'에 대한 150개 이상의 해설을 10개 언어로 들을 수 있습니다."
      petit_palais: "파리 {petit_palais}는 무료 관람 앱을 제공하며, 걸작 12점과 필수 작품 30점 등 6가지 코스가 있습니다."
  photos:
    q: 파리의 미술관·박물관 안에서 사진을 찍을 수 있나요?
    a:
      louvre: "네. 파리 {louvre}의 상설 전시에서는 개인 용도의 사진과 동영상 촬영이 가능하지만, 플래시·조명·셀카봉은 쓸 수 없습니다."
      orsay: "네. 파리 {orsay}에서는 플래시를 끄면 개인 용도의 사진과 동영상 촬영이 가능합니다. 주로 특별전의 일부 작품은 촬영 금지로 표시되어 있고, 삼각대는 물품 보관소에 맡겨야 합니다."
      petit_palais: "네. 파리 {petit_palais}에서는 작품과 다른 관람객을 배려한다면 개인 용도의 사진 촬영이 가능합니다."
  bags:
    q: 파리의 미술관·박물관에 배낭이나 여행 가방을 가지고 들어갈 수 있나요?
    a:
      louvre: "파리 {louvre}에는 55 × 35 × 20 cm를 넘는 물건을 들고 들어갈 수 없으며, 여행 가방과 큰 가방은 입장이 거절됩니다. 작은 짐은 무료 사물함에 맡길 수 있습니다."
      orangerie: "파리 {orangerie}의 사물함과 물품 보관소는 전시실에 들고 갈 수 없는 부피 큰 짐만 받으며, 모든 가방은 보안 검색을 거칩니다."
      petit_palais: "파리 {petit_palais}에는 여행 가방과 큰 가방을 가지고 들어갈 수 없습니다. 핸드백과 A3 크기 이하의 작은 배낭은 괜찮으며, 1층(지상층) 사물함은 자리가 있는 동안 이용할 수 있습니다."
  christmas-new-year:
    q: 2026년 크리스마스와 새해 첫날에 파리의 미술관·박물관은 문을 여나요?
    applies_to: 2026년 12월 24일 ~ 2027년 1월 1일
    a: "크리스마스(2026년 12월 25일 금요일)에는 파리 {louvre}, {orsay}, {orangerie}, {petit_palais}가 모두 휴관합니다.\n\n새해 첫날(2027년 1월 1일 금요일)에는 {louvre}과 {petit_palais}가 휴관합니다. {orsay}과 {orangerie}은 휴관일에 1월 1일을 넣지 않았으므로 평소 금요일 시간대로 열 것으로 보이지만, 당일 공식 사이트에서 확인하세요.\n\n네 곳 모두 12월 24일이나 31일의 특별 운영 시간은 발표하지 않았습니다."
  arc-de-triomphe-holidays:
    q: 2026년 크리스마스와 새해 첫날에 개선문은 문을 여나요? 엘리베이터는 운행하나요?
    applies_to: 2026년 12월 24일 ~ 2027년 1월 1일
    a: "파리 개선문은 2026년 12월 24일과 31일에 16:00로 일찍 닫습니다. 공식 사이트의 연간 휴관일에는 12월 25일과 1월 1일이 없습니다.\n\n엘리베이터는 운행이 중단되어 계단(284계단)으로만 올라갈 수 있습니다. 운행 재개 시기는 2027년에 발표될 예정입니다. 마지막 입장은 폐관 45분 전입니다."
  strikes-closures:
    q: 파리의 미술관·박물관이 파업으로 문을 닫는지 어떻게 알 수 있나요?
    a: "파업이나 시위로 인한 휴관은 각 기관의 공식 사이트(보통 운영 시간 페이지나 첫 화면)와 파리 뮤지엄 패스 공식 사이트에 공지됩니다.\n\n방문 당일 아침에 확인하세요. 휴관은 일부(전시실이나 입구 일부)일 수도, 전체일 수도 있습니다."
