title: "パリの美術館 よくある質問：休館日・チケット・パリ・ミュージアム・パス・祝日"
intro: "パリのルーヴル美術館、オルセー美術館、オランジュリー美術館、プティ・パレを訪れる人のための簡潔な回答集です。休館日、予約、無料入館、パリ・ミュージアム・パス（Paris Museum Pass）、音声ガイド、祝日の開館を扱います。各回答に公式情報源と確認日を記載しています。"
groups:
  plan: 見学の計画
  tickets: チケット・無料入館・パリ・ミュージアム・パス
  museums: 館内のルール
  holidays: 祝日・ストライキ・休館
items:
  closed-days:
    q: パリの各美術館の休館日は何曜日？
    a:
      louvre: "パリの{louvre}は毎週火曜日が休館です。ほかに 1 月 1 日、5 月 1 日、12 月 25 日も休館。その他の祝日は、火曜日に当たらない限り開館します。"
      orsay: "パリの{orsay}は毎週月曜日が休館です。ほかに 5 月 1 日と 12 月 25 日も休館です。"
      orangerie: "パリの{orangerie}は毎週火曜日が休館です。ほかに 5 月 1 日、12 月 25 日、7 月 14 日の午前も休館です。"
      petit_palais: "パリの{petit_palais}は毎週月曜日が休館です。ほかに 1 月 1 日、5 月 1 日、7 月 14 日、11 月 11 日、12 月 25 日も休館です。"
  louvre-booking:
    q: "{louvre}は事前に時間指定の予約が必要？"
    a: "パリの{louvre}では、無料で入館できる人も含め、すべての来館者に時間指定の予約が推奨されています。\n\n特に混雑する時期には全員の予約が必須になることがあり、例えば 2026 年 10 月 17 日〜11 月 1 日がそうです。出かける前に公式サイトの開館時間ページを確認してください。"
  louvre-night:
    q: "{louvre}の夜間開館は何曜日で、何時まで？"
    a: "パリの{louvre}は水曜日と金曜日に 21:00 まで開館しています。\n\nほかの開館日（月・木・土・日）は 18:00 閉館です。最終入館は閉館の 1 時間前で、閉館 30 分前から展示室の退出が始まります。"
  louvre-time:
    q: "{louvre}の見学には何時間かかる？ 2〜3 時間しかない場合は？"
    a: "パリの{louvre}の公式コース「ルーヴルの傑作」は約 90 分です。\n\n2〜3 時間しかないなら、まずこのコースを回り、残りの時間を興味のある翼（展示エリア）一つにあてましょう。"
  louvre-orsay-one-day:
    q: "{louvre}と{orsay}を同じ日に回れる？"
    a: "回れます。パリの{louvre}と{orsay}はどちらも水・木・金・土・日に開館しています。{louvre}は火曜日、{orsay}は月曜日が休館です。\n\nおすすめは木曜日。{orsay}がこの日は 21:45 まで開館（最終入館 21:00）なので、昼は 09:00 開館の{louvre}、夜に{orsay}という組み合わせができます。水曜日と金曜日はその逆で、{louvre}が 21:00 まで開いています。"
  orangerie-water-lilies:
    q: "モネの《睡蓮》は{orangerie}のどこにある？"
    a: "パリの{orangerie}にあるモネの《睡蓮》（Nymphéas）は、続きになった二つの楕円形の展示室を埋めており、ガラス屋根からの自然光で照らされています。\n\n8 点の大作は 1927 年、モネ自身の構想どおりに設置されました。一つ目の部屋は朝から夕方までの空の水面への映り込み、二つ目の部屋は水辺を縁取る柳の枝が描かれた作品です。"
  museum-pass:
    q: パリ・ミュージアム・パスとは？ ルーヴル、オルセー、オランジュリーは使える？
    a: "パリ・ミュージアム・パスは、50 以上の美術館・史跡に入場できるパスで、{louvre}、{orsay}、{orangerie}、凱旋門も含まれます。{petit_palais}は対象外ですが、常設展はもともと無料です。\n\n料金は 2 日券 85 ユーロ、4 日券 105 ユーロ、6 日券 125 ユーロ。日数は最初の入場時から時間単位（48・96・144 時間）で数え、企画展は含まれません。18 歳未満と、26 歳未満の EU 居住者は多くの施設が無料なので、通常パスは不要です。\n\nGoMuseum のパリ・パスは別物です。GoMuseum アプリの音声ガイドを使えるようにするだけで、美術館の入場券は含まれません。"
  museum-pass-louvre-entry:
    q: "パリ・ミュージアム・パスがあれば予約なしで{louvre}に入れる？"
    a: "保証はありません。パリ・ミュージアム・パスでパリの{louvre}への入場が確実になるのは、時間指定の予約をした場合だけです。\n\n予約は無料で、パリ・ミュージアム・パスの公式サイトで行います。予約なしで列に並ぶこともできますが、混雑時は非常に時間がかかったり、入れなかったりします。{orsay}もパス保有者に同じ公式サイトでの時間予約を求めています。"
  free-entry:
    q: パリの美術館に無料で入れるのはどんな人？
    a:
      louvre: "パリの{louvre}は 18 歳未満の全員と、26 歳未満の欧州経済領域（EEA）居住者が無料です。写真付き身分証が必要で、居住者は 90 日を超える居住の証明も必要です。"
      orsay: "パリの{orsay}は 18 歳未満の全員と、26 歳未満の欧州経済領域（EEA）居住者が無料です。"
      orangerie: "パリの{orangerie}は 18 歳未満の全員が無料です。18〜25 歳の EU 市民、または EU に 3 か月を超えて住んでいる人も無料です。"
      petit_palais: "パリの{petit_palais}の常設展は誰でも無料で、予約も不要です。企画展は有料です。"
  first-sunday:
    q: パリの美術館は毎月第 1 日曜日が無料？
    a:
      louvre: "パリの{louvre}は第 1 日曜日は無料ではありません。毎月第 1 金曜日の 18:00 以降（7 月・8 月を除く）と 7 月 14 日が全員無料です。"
      orsay: "はい、パリの{orsay}は毎月第 1 日曜日が全員無料です。ただし事前の時間予約が必要です。"
      orangerie: "はい、パリの{orangerie}は毎月第 1 日曜日が全員無料です。時間予約が必須です。"
      petit_palais: "パリの{petit_palais}の常設展は開館日ならいつでも無料なので、特定の日を待つ必要はありません。"
  petit-palais-ticket:
    q: "{petit_palais}にはチケットが必要？"
    a: "不要です。パリの{petit_palais}の常設展は無料で、予約もいりません。\n\n有料なのは企画展だけで、予約が強く推奨されています。開館は火曜日から日曜日の 10:00〜18:00、金曜日と土曜日は企画展のみ 20:00 まで開館します。"
  must-see:
    q: パリの各美術館で見逃せないものは？
    a:
      louvre: "{louvre}には約 90 分の公式コース「ルーヴルの傑作」があります。当サイトの{louvre}の必見リストは、この公式コースに沿っています。"
      orsay: "{orsay}は 1848 年から 1914 年の美術を扱い、インフォメーションから出発する傑作ガイドツアーを行っています。当サイトの{orsay}の必見リストでは、GoMuseum で解説を読んだり聴いたりできる作品を紹介しています。"
      orangerie: "{orangerie}でいちばん見逃せないのはモネの《睡蓮》です。8 点の大作が、モネ自身の構想どおり二つの楕円形の展示室に並んでいます。"
      petit_palais: "{petit_palais}は無料の見学アプリを提供しており、12 点の傑作をめぐるコースと、30 点の必見作品をめぐるコースがあります。"
  audio-guides:
    q: パリの各美術館の音声ガイドは？
    a:
      louvre: "パリの{louvre}ではピラミッド下のカウンターで音声ガイドを 6 ユーロで借りられ、チケットと一緒にオンライン予約もできます。150 点以上の傑作を収録し、9 言語に対応しています。"
      orsay: "パリの{orsay}では館内で音声ガイドを 6 ユーロ（割引 4 ユーロ）で貸し出しており、300 以上の解説を 10 言語で聴けます。スマートフォンにダウンロードする版は、開催中の主要な企画展だけが対象です。"
      orangerie: "パリの{orangerie}では館内で音声ガイドを貸し出しており、常設展と《睡蓮》について 150 以上の解説を 10 言語で聴けます。"
      petit_palais: "パリの{petit_palais}は無料の見学アプリを提供しており、12 点の傑作や 30 点の必見作品など 6 つのコースがあります。"
  photos:
    q: パリの美術館の中で写真は撮れる？
    a:
      louvre: "撮れます。パリの{louvre}では常設展で個人用の写真・動画撮影ができますが、フラッシュ、照明、自撮り棒は使えません。"
      orsay: "撮れます。パリの{orsay}ではフラッシュをオフにすれば、個人用の写真・動画撮影ができます。企画展では一部の作品が撮影禁止の場合があり、三脚はクロークに預ける必要があります。"
      petit_palais: "撮れます。パリの{petit_palais}では、作品とほかの来館者に配慮すれば個人用の写真撮影ができます。"
  bags:
    q: パリの美術館にリュックやスーツケースを持ち込める？
    a:
      louvre: "パリの{louvre}では 55 × 35 × 20 cm を超える物は持ち込めず、スーツケースや大きなバッグは入館を断られます。小さな荷物は無料のロッカーに預けられます。"
      orangerie: "パリの{orangerie}のロッカーとクロークは、展示室に持ち込めない大きな荷物だけを預かります。バッグはすべてセキュリティチェックを受けます。"
      petit_palais: "パリの{petit_palais}ではスーツケースと大きなバッグは持ち込めません。ハンドバッグと A3 サイズまでの小さなリュックは持ち込み可で、1 階（地上階）にロッカーがあります（空きがある場合）。"
  christmas-new-year:
    q: 2026 年のクリスマスと 2027 年の元日、パリの美術館は開いている？
    applies_to: 2026 年 12 月 24 日〜2027 年 1 月 1 日
    a: "クリスマス当日（2026 年 12 月 25 日・金曜日）は、パリの{louvre}、{orsay}、{orangerie}、{petit_palais}がすべて休館です。\n\n元日（2027 年 1 月 1 日・金曜日）は{louvre}と{petit_palais}が休館です。{orsay}と{orangerie}は休館日に 1 月 1 日を挙げていないため、通常の金曜日の時間で開館するはずですが、当日に公式サイトで確認してください。"
  arc-de-triomphe-holidays:
    q: 2026 年のクリスマスと 2027 年の元日に凱旋門は開いている？ エレベーターは使える？
    applies_to: 2026 年 12 月 24 日〜2027 年 1 月 1 日
    a: "パリの凱旋門は 2026 年 12 月 24 日と 31 日、16:00 に早めに閉まります。公式サイトの年間休館日に 12 月 25 日と 1 月 1 日は含まれていません。\n\nエレベーターは運休中で、上るには階段（284 段）しかありません。2027 年に再開予定で、具体的な日程は後日発表されます。最終入場は閉館の 45 分前です。"
  strikes-closures:
    q: パリの美術館がストライキで休館かどうか、どうやって調べる？
    a: "ストライキやデモによる休館は、各美術館の公式サイトと、パリ・ミュージアム・パスの公式サイトで告知されます。\n\n見学当日の朝に確認しましょう。休館は一部（展示室や入口の一部）の場合も、全館の場合もあります。"
