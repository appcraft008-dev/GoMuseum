title: "巴黎博物館參觀問答：休館日、門票、巴黎博物館通行證與節假日"
intro: "參觀巴黎羅浮宮、奧賽博物館、橘園美術館和小皇宮美術館的直接解答：休館日、預約、免費入場、巴黎博物館通行證（Paris Museum Pass）、語音導覽和節假日開放。每則解答都附官方來源和核對日期。"
groups:
  plan: 行程規劃
  tickets: 門票、免費入場與巴黎博物館通行證
  museums: 館內須知
  holidays: 節假日、罷工與休館
items:
  closed-days:
    q: 巴黎各博物館每週哪天休館？
    a:
      louvre: "巴黎{louvre}每週二休館。另外 1 月 1 日、5 月 1 日和 12 月 25 日休館；其他國定假日照常開放，除非剛好是週二。"
      orsay: "巴黎{orsay}每週一休館。另外 5 月 1 日和 12 月 25 日休館。"
      orangerie: "巴黎{orangerie}每週二休館。另外 5 月 1 日、12 月 25 日以及 7 月 14 日上午休館。"
      petit_palais: "巴黎{petit_palais}每週一休館。另外 1 月 1 日、5 月 1 日、7 月 14 日、11 月 11 日和 12 月 25 日休館。"
  louvre-booking:
    q: 參觀{louvre}需要提前預約時段嗎？
    a: "巴黎{louvre}建議所有觀眾提前預約入場時段，包括免費入場的觀眾。\n\n人潮特別多的時候，博物館可能要求所有人一律預約，例如 2026 年 10 月 17 日至 11 月 1 日。出發前請先看官網的開放時間頁面。"
  louvre-night:
    q: "{louvre}哪幾天有夜間開放，開到幾點？"
    a: "巴黎{louvre}每週三和週五開放到 21:00。\n\n其他開放日（週一、週四、週六、週日）18:00 閉館。閉館前一小時停止入場，閉館前 30 分鐘開始清場。"
  louvre-time:
    q: 逛{louvre}要多久？只有兩三個小時怎麼看？
    a: "巴黎{louvre}官方的「羅浮宮傑作」路線約需 90 分鐘。\n\n如果只有兩三個小時，先走完這條路線，剩下的時間留給你最感興趣的一個展區。"
  louvre-orsay-one-day:
    q: 一天能同時參觀{louvre}和{orsay}嗎？
    a: "可以。巴黎{louvre}和{orsay}在週三、週四、週五、週六、週日都開放；{louvre}週二休館，{orsay}週一休館。\n\n週四最合適：{orsay}當天開放到 21:45（21:00 停止入場），所以白天可以去 09:00 開門的{louvre}，晚上再看{orsay}。週三和週五剛好相反：{louvre}開放到 21:00。"
  orangerie-water-lilies:
    q: 莫內的《睡蓮》在{orangerie}的哪裡？
    a: "巴黎{orangerie}的莫內《睡蓮》（Nymphéas）占據兩間相連的橢圓形展廳，靠玻璃屋頂的自然光照明。\n\n八幅巨型畫作於 1927 年依莫內本人的設計布置。第一間呈現從早到晚天空和植物在水中的倒影；第二間是垂柳枝條環繞的水面。"
  museum-pass:
    q: 巴黎博物館通行證（Paris Museum Pass）是什麼？包含羅浮宮、奧賽和橘園嗎？
    a: "巴黎博物館通行證可進入巴黎及周邊 50 多座博物館和古蹟各一次，包括{louvre}、{orsay}、{orangerie}和凱旋門；{petit_palais}不在名單上，但它的常設展本來就免費。\n\n價格：2 天 85 歐元、4 天 105 歐元、6 天 125 歐元。天數按小時計（48、96 或 144 小時），從第一次使用時起算，不含特展。18 歲以下，以及 26 歲以下的歐盟居民，多數場館本來就免費，一般不需要買通行證。\n\nGoMuseum 的巴黎通行證是另一回事：它只解鎖 GoMuseum App 裡的語音導覽，不含任何博物館門票。"
  museum-pass-louvre-entry:
    q: 持巴黎博物館通行證能不預約直接進{louvre}嗎？
    a: "不保證：持巴黎博物館通行證，只有預約了時段才能確保進入巴黎{louvre}。\n\n時段預約免費，在巴黎博物館通行證官網辦理。不預約也可以排隊試試，但人多時可能要等很久，甚至進不去。{orsay}同樣要求通行證持有人在同一官網預約時段。"
  free-entry:
    q: 哪些人可以免費參觀巴黎的博物館？
    a:
      louvre: "巴黎{louvre}對 18 歲以下所有人、以及 26 歲以下的歐洲經濟區居民免費，需出示附照片的證件（居民還需證明居住超過 90 天）。"
      orsay: "巴黎{orsay}對 18 歲以下所有人、以及 26 歲以下的歐洲經濟區居民免費。"
      orangerie: "巴黎{orangerie}對 18 歲以下所有人免費；18 至 25 歲的歐盟公民或在歐盟居住超過三個月的人也免費，需出示身分證明。"
      petit_palais: "巴黎{petit_palais}的常設展對所有人免費，無需預約。特展收費。"
  first-sunday:
    q: 巴黎的博物館每月第一個週日免費嗎？
    a:
      louvre: "巴黎{louvre}第一個週日不免費。它在每月第一個週五 18:00 以後對所有人免費（7 月、8 月除外），7 月 14 日也免費。"
      orsay: "是的，巴黎{orsay}每月第一個週日對所有人免費，但必須提前預約時段。"
      orangerie: "是的，巴黎{orangerie}每月第一個週日對所有人免費，須預約時段。"
      petit_palais: "巴黎{petit_palais}的常設展每個開放日都免費，不必等特定日子。"
  petit-palais-ticket:
    q: 參觀{petit_palais}需要買票嗎？
    a: "不需要。巴黎{petit_palais}的常設展免費，也不用預約。\n\n只有特展收費，強烈建議提前預約。開放時間為週二至週日 10:00–18:00，週五、週六晚上開放到 20:00，但只開特展。"
  must-see:
    q: 巴黎各博物館有哪些不能錯過？
    a:
      louvre: "{louvre}官方有一條「羅浮宮傑作」路線，約 90 分鐘。我們的{louvre}必看清單就是依這條官方路線整理的。"
      orsay: "{orsay}收藏 1848 至 1914 年間的藝術，並提供從服務台出發的傑作導覽。我們的{orsay}必看清單列出可在 GoMuseum 裡閱讀和收聽解說的作品。"
      orangerie: "{orangerie}最不能錯過的是莫內的《睡蓮》：八幅巨型畫作，布置在兩間橢圓形展廳裡，依莫內本人的設計安排。"
      petit_palais: "{petit_palais}提供免費的參觀 App，有一條 12 件傑作路線和一條 30 件必看作品路線。"
  audio-guides:
    q: 巴黎各博物館有哪些語音導覽可選？
    a:
      louvre: "巴黎{louvre}在玻璃金字塔下方的櫃檯出租語音導覽機，6 歐元；也可以買票時線上預訂。涵蓋 150 多件傑作，有 9 種語言。"
      orsay: "巴黎{orsay}現場出租語音導覽機，6 歐元（優惠價 4 歐元），300 多則解說，10 種語言。可下載到手機的版本只涵蓋當期的主要特展。"
      orangerie: "巴黎{orangerie}現場出租語音導覽機，150 多則解說，涵蓋常設展和《睡蓮》，10 種語言。"
      petit_palais: "巴黎{petit_palais}提供免費參觀 App，有六條路線，包括 12 件傑作和 30 件必看作品。"
  photos:
    q: 巴黎的博物館裡可以拍照嗎？
    a:
      louvre: "可以。巴黎{louvre}常設展內可拍照、錄影供個人使用，但不能開閃光燈、補光燈，也不能用自拍棒。"
      orsay: "可以。巴黎{orsay}允許拍攝個人用途的照片和影片，須關閉閃光燈。部分作品（主要在特展）標示禁止拍照，三腳架須寄放。"
      petit_palais: "可以。巴黎{petit_palais}允許拍攝個人用途的照片，但要尊重作品和其他觀眾。"
  bags:
    q: 巴黎的博物館能帶背包或行李箱進去嗎？
    a:
      louvre: "巴黎{louvre}不允許攜帶超過 55 × 35 × 20 公分的物品，行李箱和大包會被拒絕入內。較小的物品可以放免費置物櫃。"
      orangerie: "巴黎{orangerie}的置物櫃和衣帽間只收不能帶進展廳的大件物品；所有包都要過安檢。"
      petit_palais: "巴黎{petit_palais}禁止攜帶行李箱和大包。手提包和不超過 A3 尺寸的小背包可以帶入；一樓有置物櫃，先到先用。"
  christmas-new-year:
    q: 2026 年聖誕節和 2027 年元旦，巴黎的博物館開門嗎？
    applies_to: 2026 年 12 月 24 日 – 2027 年 1 月 1 日
    a: "聖誕節（2026 年 12 月 25 日，週五）巴黎{louvre}、{orsay}、{orangerie}和{petit_palais}全部休館。\n\n元旦（2027 年 1 月 1 日，週五）{louvre}和{petit_palais}休館。{orsay}和{orangerie}的休館日沒有列 1 月 1 日，應按平常的週五時間開放；當天請再看一下官網。"
  arc-de-triomphe-holidays:
    q: 2026 年聖誕和 2027 年元旦凱旋門開嗎？電梯能用嗎？
    applies_to: 2026 年 12 月 24 日 – 2027 年 1 月 1 日
    a: "巴黎凱旋門在 2026 年 12 月 24 日和 31 日提前到 16:00 關門。官網的年度休館日沒有 12 月 25 日和 1 月 1 日。\n\n電梯停用，只能走樓梯上去：284 級台階。電梯預計 2027 年恢復使用，具體日期另行公布。閉館前 45 分鐘停止入場。"
  strikes-closures:
    q: 怎麼知道巴黎的博物館是否因罷工休館？
    a: "因罷工或遊行造成的休館，會公布在各博物館官網（通常在開放時間頁或首頁）和巴黎博物館通行證官網上。\n\n參觀當天早上再查一次：休館可能是部分的（個別展廳或入口），也可能是全館。"
