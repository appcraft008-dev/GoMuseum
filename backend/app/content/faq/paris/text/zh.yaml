title: "巴黎博物馆参观问答：闭馆日、门票、巴黎博物馆通票与节假日"
intro: "参观巴黎卢浮宫、奥赛博物馆、橘园美术馆和小皇宫美术馆的直接答案：闭馆日、预约、免费入场、巴黎博物馆通票（Paris Museum Pass）、语音讲解器和节假日开放。每条答案都附官方来源和核对日期。"
groups:
  plan: 行程规划
  tickets: 门票、免费入场与巴黎博物馆通票
  museums: 馆内须知
  holidays: 节假日、罢工与闭馆
items:
  closed-days:
    q: 巴黎各博物馆每周哪天闭馆？
    a:
      louvre: "巴黎{louvre}每周二闭馆。另外 1 月 1 日、5 月 1 日和 12 月 25 日闭馆；其他公共假日照常开放，除非恰逢周二。"
      orsay: "巴黎{orsay}每周一闭馆。另外 5 月 1 日和 12 月 25 日闭馆。"
      orangerie: "巴黎{orangerie}每周二闭馆。另外 5 月 1 日、12 月 25 日以及 7 月 14 日上午闭馆。"
      petit_palais: "巴黎{petit_palais}每周一闭馆。另外 1 月 1 日、5 月 1 日、7 月 14 日、11 月 11 日和 12 月 25 日闭馆。"
  louvre-booking:
    q: 参观{louvre}需要提前预约时段吗？
    a: "巴黎{louvre}建议所有观众提前预约入场时段，包括免费入场的观众。\n\n客流特别大的时候，博物馆可能要求所有人必须预约，例如 2026 年 10 月 17 日至 11 月 1 日。出发前请先看官网的开放时间页面。"
  louvre-night:
    q: "{louvre}哪几天有夜场，开到几点？"
    a: "巴黎{louvre}每周三和周五开放到 21:00。\n\n其他开放日（周一、周四、周六、周日）18:00 闭馆。闭馆前一小时停止入场，闭馆前 30 分钟开始清场。"
  louvre-time:
    q: 逛{louvre}要多久？只有两三个小时怎么看？
    a: "巴黎{louvre}官方的「卢浮宫杰作」路线约需 90 分钟。\n\n如果只有两三个小时，先走完这条路线，剩下的时间留给你最感兴趣的一个展区。"
  louvre-orsay-one-day:
    q: 一天能同时参观{louvre}和{orsay}吗？
    a: "可以。巴黎{louvre}和{orsay}在周三、周四、周五、周六、周日都开放；{louvre}周二闭馆，{orsay}周一闭馆。\n\n周四最合适：{orsay}当天开放到 21:45（21:00 停止入场），所以白天可以去 09:00 开门的{louvre}，晚上再看{orsay}。周三和周五正好反过来：{louvre}开放到 21:00。"
  orangerie-water-lilies:
    q: 莫奈的《睡莲》在{orangerie}的哪里？
    a: "巴黎{orangerie}的莫奈《睡莲》（Nymphéas）占据两间相连的椭圆形展厅，靠玻璃屋顶的自然光照明。\n\n八幅巨型画作于 1927 年按莫奈本人的设计布置。第一间展示从早到晚天空和植物在水中的倒影；第二间是垂柳枝条环绕的水面。"
  museum-pass:
    q: 巴黎博物馆通票（Paris Museum Pass）是什么？包含卢浮宫、奥赛和橘园吗？
    a: "巴黎博物馆通票可进入巴黎及周边 50 多家博物馆和古迹各一次，包括{louvre}、{orsay}、{orangerie}和凯旋门；{petit_palais}不在名单上，但它的常设展本来就免费。\n\n价格：2 天 85 欧元、4 天 105 欧元、6 天 125 欧元。天数按小时计（48、96 或 144 小时），从第一次使用时开始算，不含临时展。18 岁以下，以及 26 岁以下的欧盟居民，大多数场馆本来就免费，一般不需要买通票。\n\nGoMuseum 的巴黎通票是另一回事：它只解锁 GoMuseum App 里的语音讲解，不含任何博物馆门票。"
  museum-pass-louvre-entry:
    q: 持巴黎博物馆通票能不预约直接进{louvre}吗？
    a: "不保证：持巴黎博物馆通票，只有预约了时段才能确保进入巴黎{louvre}。\n\n时段预约免费，在巴黎博物馆通票官网办理。不预约也可以排队试试，但人多时可能要等很久，甚至进不去。{orsay}同样要求通票持有人在同一官网预约时段。"
  free-entry:
    q: 哪些人可以免费参观巴黎的博物馆？
    a:
      louvre: "巴黎{louvre}对 18 岁以下所有人、以及 26 岁以下的欧洲经济区居民免费，需出示带照片的证件（居民还需证明居住超过 90 天）。"
      orsay: "巴黎{orsay}对 18 岁以下所有人、以及 26 岁以下的欧洲经济区居民免费。"
      orangerie: "巴黎{orangerie}对 18 岁以下所有人免费；18 至 25 岁的欧盟公民或在欧盟居住超过三个月的人也免费，需出示身份证明。"
      petit_palais: "巴黎{petit_palais}的常设展对所有人免费，无需预约。临时展收费。"
  first-sunday:
    q: 巴黎的博物馆每月第一个周日免费吗？
    a:
      louvre: "巴黎{louvre}第一个周日不免费。它在每月第一个周五 18:00 以后对所有人免费（7 月、8 月除外），7 月 14 日也免费。"
      orsay: "是的，巴黎{orsay}每月第一个周日对所有人免费，但必须提前预约时段。"
      orangerie: "是的，巴黎{orangerie}每月第一个周日对所有人免费，须预约时段。"
      petit_palais: "巴黎{petit_palais}的常设展每个开放日都免费，不用等特定日子。"
  petit-palais-ticket:
    q: 参观{petit_palais}需要买票吗？
    a: "不需要。巴黎{petit_palais}的常设展免费，也不用预约。\n\n只有临时展收费，强烈建议提前预约。开放时间为周二至周日 10:00–18:00，周五、周六晚上开放到 20:00，但只开临时展。"
  must-see:
    q: 巴黎各博物馆有哪些不能错过？
    a:
      louvre: "{louvre}官方有一条「卢浮宫杰作」路线，约 90 分钟。我们的{louvre}必看清单就是按这条官方路线整理的。"
      orsay: "{orsay}收藏 1848 至 1914 年间的艺术，并提供从咨询台出发的杰作导览。我们的{orsay}必看清单列出了能在 GoMuseum 里阅读和收听讲解的作品。"
      orangerie: "{orangerie}最不能错过的是莫奈的《睡莲》：八幅巨型画作，布置在两间椭圆形展厅里，按莫奈本人的设计安排。"
      petit_palais: "{petit_palais}提供免费的参观 App，有一条 12 件杰作路线和一条 30 件必看作品路线。"
  audio-guides:
    q: 巴黎各博物馆有哪些语音讲解可选？
    a:
      louvre: "巴黎{louvre}在玻璃金字塔下方的柜台出租语音讲解器，6 欧元；也可以买票时在线预订。涵盖 150 多件杰作，有 9 种语言。"
      orsay: "巴黎{orsay}现场出租语音讲解器，6 欧元（优惠价 4 欧元），300 多条讲解，10 种语言。可下载到手机的版本只覆盖当前的主要临时展。"
      orangerie: "巴黎{orangerie}现场出租语音讲解器，150 多条讲解，涵盖常设展和《睡莲》，10 种语言。"
      petit_palais: "巴黎{petit_palais}提供免费参观 App，有六条路线，包括 12 件杰作和 30 件必看作品。"
  photos:
    q: 巴黎的博物馆里可以拍照吗？
    a:
      louvre: "可以。巴黎{louvre}常设展内可拍照、录像供个人使用，但不能开闪光灯、补光灯，也不能用自拍杆。"
      orsay: "可以。巴黎{orsay}允许拍摄个人用途的照片和视频，须关闭闪光灯。部分作品（主要在临时展）标明禁止拍照，三脚架须寄存。"
      petit_palais: "可以。巴黎{petit_palais}允许拍摄个人用途的照片，但要尊重作品和其他观众。"
  bags:
    q: 巴黎的博物馆能带背包或行李箱进去吗？
    a:
      louvre: "巴黎{louvre}不允许携带超过 55 × 35 × 20 厘米的物品，行李箱和大包会被拒绝入内。较小的物品可以放免费储物柜。"
      orangerie: "巴黎{orangerie}的储物柜和衣帽间只收不能带进展厅的大件物品；所有包都要过安检。"
      petit_palais: "巴黎{petit_palais}禁止携带行李箱和大包。手提包和不超过 A3 尺寸的小背包可以带入；一楼有储物柜，先到先得。"
  christmas-new-year:
    q: 2026 年圣诞节和元旦，巴黎的博物馆开门吗？
    applies_to: 2026 年 12 月 24 日 – 2027 年 1 月 1 日
    a: "圣诞节（2026 年 12 月 25 日，周五）巴黎{louvre}、{orsay}、{orangerie}和{petit_palais}全部闭馆。\n\n元旦（2027 年 1 月 1 日，周五）{louvre}和{petit_palais}闭馆。{orsay}和{orangerie}的闭馆日里没有列 1 月 1 日，应按平常的周五时间开放；当天请再看一下官网。\n\n这四家博物馆都没有公布 12 月 24 日或 31 日的特别开放时间。"
  arc-de-triomphe-holidays:
    q: 2026 年圣诞和元旦凯旋门开吗？电梯能用吗？
    applies_to: 2026 年 12 月 24 日 – 2027 年 1 月 1 日
    a: "巴黎凯旋门在 2026 年 12 月 24 日和 31 日提前到 16:00 关门。官网的年度闭馆日里没有 12 月 25 日和 1 月 1 日。\n\n电梯停用，只能走楼梯上去：284 级台阶。凯旋门表示会在 2027 年公布电梯恢复时间。闭馆前 45 分钟停止入场。"
  strikes-closures:
    q: 怎么知道巴黎的博物馆是否因罢工闭馆？
    a: "因罢工或游行导致的闭馆，会公布在各博物馆官网（通常在开放时间页或首页）和巴黎博物馆通票官网上。\n\n参观当天早上再查一次：闭馆可能是部分的（个别展厅或入口），也可能是全馆。"
