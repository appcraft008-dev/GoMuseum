<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>重设密码 · GoMuseum</title>
<style>
  :root { --bg:#F3EDDF; --card:#FBF7EC; --ink:#2C2316; --sub:#8A7A5F; --line:#DCD2B8; --accent:#A14E28; --bad:#9B2C2C; --good:#2F6B3F; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink); font-family:'Noto Sans SC','PingFang SC',-apple-system,sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  main { width:100%; max-width:420px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:32px 26px; }
  h1 { font-family:'Noto Serif SC','Songti SC',serif; font-size:21px; font-weight:700; text-align:center; }
  .sub { text-align:center; font-size:13px; color:var(--sub); margin:10px 0 26px; line-height:1.7; }
  label { display:block; font-size:13px; color:var(--sub); margin:16px 0 6px; }
  input { width:100%; padding:11px 13px; font-size:15px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); }
  input:focus { outline:2px solid var(--accent); outline-offset:1px; }
  button { width:100%; margin-top:22px; padding:12px; font-size:15px; font-weight:600; color:#fff; background:var(--accent); border:0; border-radius:8px; cursor:pointer; }
  button:disabled { opacity:.55; cursor:default; }
  .msg { margin-top:16px; font-size:13px; line-height:1.7; text-align:center; }
  .msg.bad { color:var(--bad); }
  .msg.good { color:var(--good); }
  .hint { font-size:12px; color:var(--sub); margin-top:6px; line-height:1.6; }
</style>
</head>
<body>
<main>
  <h1>重设密码</h1>
  <p class="sub">Set a new password<br />Définir un nouveau mot de passe</p>

  <form id="f">
    <label for="p1">新密码 / New password</label>
    <input id="p1" type="password" autocomplete="new-password" minlength="8" required />
    <p class="hint">至少 8 个字符 · At least 8 characters</p>

    <label for="p2">再输一次 / Repeat</label>
    <input id="p2" type="password" autocomplete="new-password" minlength="8" required />

    <button id="go" type="submit">确认 / Confirm</button>
  </form>
  <p class="msg" id="m"></p>
</main>

<script>
// 令牌由服务端注入,**不从 URL 读**:URL 会进浏览器历史、Referer 与
// 任何页内第三方资源的请求头。这里没有第三方资源,但注入是更稳的那一侧。
const TOKEN = "__TOKEN__";
const f = document.getElementById('f');
const m = document.getElementById('m');
const go = document.getElementById('go');

f.addEventListener('submit', async (e) => {
  e.preventDefault();
  const p1 = document.getElementById('p1').value;
  const p2 = document.getElementById('p2').value;
  m.className = 'msg';
  if (p1 !== p2) { m.className = 'msg bad'; m.textContent = '两次输入不一致 / Passwords do not match'; return; }
  if (p1.length < 8) { m.className = 'msg bad'; m.textContent = '至少 8 个字符 / At least 8 characters'; return; }

  go.disabled = true;
  try {
    const r = await fetch('/api/v1/auth/password-reset/confirm', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: TOKEN, new_password: p1 })
    });
    if (r.status === 204) {
      f.style.display = 'none';
      m.className = 'msg good';
      m.textContent = '密码已更新，回 App 用新密码登录即可。\nPassword updated — sign in with it in the app.';
      return;
    }
    m.className = 'msg bad';
    m.textContent = r.status === 400
      ? '链接已失效或已用过，请回 App 重新申请。\nThis link has expired or was already used.'
      : '出了点问题，请稍后再试 / Something went wrong, please try again.';
  } catch (_) {
    m.className = 'msg bad';
    m.textContent = '网络错误 / Network error';
  }
  go.disabled = false;
});
</script>
</body>
</html>
