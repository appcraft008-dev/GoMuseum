<!DOCTYPE html>
<html lang="__HTMLLANG__">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>GoMuseum</title>
<style>
  :root { --bg:#F3EDDF; --card:#FBF7EC; --ink:#2C2316; --sub:#8A7A5F; --line:#DCD2B8; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink); font-family:'Noto Sans SC','PingFang SC',-apple-system,sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  main { width:100%; max-width:420px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:34px 26px; text-align:center; }
  h1 { font-family:'Noto Serif SC','Songti SC',serif; font-size:20px; font-weight:700; }
  p { font-size:14px; color:var(--sub); line-height:1.8; margin-top:14px; white-space:pre-line; }
</style>
</head>
<body>
<main>
  <h1>__TITLE__</h1>
  <p>__BODY__</p>
</main>
</body>
</html>
