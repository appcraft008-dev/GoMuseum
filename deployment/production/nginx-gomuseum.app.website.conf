# 网站 v1(spec docs/superpowers/specs/2026-10-22-website-v1-design.md)要贴进宿主机 gomuseum.app 站点的片段。
# nginx 在宿主机,CD 带不过去,手动改。与 nginx-gomuseum.app.share.conf 并存(那份的 /a/ 与 assetlinks 保持不动)。
#
# 前置:后端已随 staging→main 上 prod(含 /{lang}/… 路由)。下面的 location 放进 443 的 server {} 里,
# 复用 share 片段里已有的 limit_req_zone gomuseum_web。
#
# 改前备份:cp /etc/nginx/sites-available/gomuseum.app /etc/nginx/sites-available/gomuseum.app.bak-YYYYMMDD-pre-website
# 改完:nginx -t && systemctl reload nginx;然后 prod .env 加 WEBSITE_LIVE=true、只重启后端(旧 /a/ 链接才开始 301 到新作品页)
# 回滚:还原备份 → nginx -t && systemctl reload nginx;.env 删 WEBSITE_LIVE 行 → 重启后端(/a/ 恢复原页面)
# 验证:
#   curl -sI https://gomuseum.app/            → 301 → /en/
#   curl -sI https://gomuseum.app/index.html  → 301 → /en/
#   curl -sI https://gomuseum.app/en/         → 200
#   curl -sI https://gomuseum.app/en/paris/louvre/Q12418/ → 200
#   curl -sI "https://gomuseum.app/a/louvre/Q12418?lang=en" → 301(WEBSITE_LIVE=true 之后)
#   curl -s  https://gomuseum.app/robots.txt ; curl -s https://gomuseum.app/sitemap.xml | head
# 隐私政策/使用条款(/privacy.html、/terms.html)与 /.well-known/ 仍是静态文件,不走后端。

location = / {
    return 301 /en/;
}
location = /index.html { return 301 /en/; }  # 旧内测落地页,别让它被收录(2026-10-23 已手动上 prod)

location ~ ^/(en|fr|zh|zh-hant|de|es|it|pl|ja|ko)/ {
    limit_req zone=gomuseum_web burst=40 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8100;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ ^/(robots\.txt|sitemap[^/]*\.xml)$ {
    proxy_pass http://127.0.0.1:8100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 静态资源、试听音频跳转、信标
location ^~ /w/ {
    limit_req zone=gomuseum_web burst=40 nodelay;
    limit_req_status 429;
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8100;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
