# 分享层要贴进宿主机 gomuseum.app 那个 nginx 站点配置的片段(nginx 在宿主机,CD 带不过去,手动)。
# spec: docs/superpowers/specs/2026-09-20-share-web-pages-design.md
#
# ① limit_req_zone 放在 server {} 之外(文件顶部);② 两个 location 放进 443 的 server {} 里。
# ③ 把仓库 deployment/website/.well-known/assetlinks.json 拷到 /opt/gomuseum/website/.well-known/
#    (两个指纹都已填:应用签名密钥 85:87:…(Play 下载装的包用它签)+ 上传密钥 EC:57:…(自己出的包)。
#     Console 里的位置 2026-09 起在「由 Google Play 提供保护 → Play 商店保护 → Play 应用签名」,
#     或把应用页地址 /app/<id>/ 后面换成 keymanagement。缺了应用签名那个,Play 装的 App 点链接只会走浏览器)
# 改完:nginx -t && systemctl reload nginx
# 验证:curl -sI https://gomuseum.app/a/<slug>/<qid> | head -1   → 200 或后端的 404(不是 nginx 的 404 页)
#       curl -s https://gomuseum.app/.well-known/assetlinks.json | python3 -m json.tool

limit_req_zone $binary_remote_addr zone=gomuseum_web:10m rate=5r/s;

location /a/ {
    limit_req zone=gomuseum_web burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8100;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /.well-known/assetlinks.json {
    default_type application/json;
    alias /opt/gomuseum/website/.well-known/assetlinks.json;
}
