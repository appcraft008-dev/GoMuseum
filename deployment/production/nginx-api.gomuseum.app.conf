# 宿主 nginx 站点：api.gomuseum.app -> GoMuseum 后端 (127.0.0.1:8100)
# 域名 DNS 解析到本机后执行: certbot --nginx -d api.gomuseum.app
#
# ⚠️ 本文件改动**不会**被 CD 自动应用（不在 backend/ 路径下，且 nginx 跑在宿主机
# 而非容器里）。改完必须手动：`nginx -t && systemctl reload nginx`。

# IP 级限流（2026-09-20 安全审计）。应用层的 slowapi limiter 只挂在
# auth/payment/feedback 上，其余端点此前**完全没有任何速率上限** —— 这是把每个
# 洞的破坏力从"有上限"变成"无上限"的乘数因子。堵在这里而不是逐个端点加装饰器：
# 下一个新加的端点会自动被覆盖，忘记加装饰器不会再造出一条敞开的水龙头。
#
# 它也是识别端点唯一的量的上限：GPT 视觉链按构造永远产不出 `match`，而只有
# `match` 才扣配额（recognition/service.py:427）⇒ 每次视觉调用都不扣费，
# 应用层配额闸对那条路径形同虚设。
#
# 总区 50r/s + burst 100（2026-10-23 弹性扩容阶段 0，原 10r/s + burst 20）：
# 博物馆团体共用一个 WiFi 出口 IP，原阈值几个人同时开页就会被误伤（spec §4.2）。
# 识别单独限流 2r/s + burst 50：它是识别 AI 兜底唯一的量的上限（spec §4.4），
# 不能跟着总区一起放宽。confirm / reject 仍走总区。
limit_req_zone $binary_remote_addr zone=gomuseum_api:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=gomuseum_recog:10m rate=2r/s;

# 带耗时的访问日志(2026-10-13 P3-14④):行尾 rt=请求总耗时(含客户端上传) urt=后端处理耗时。
# 只给本站点用,不动 nginx.conf 全局 main(同机还有别的站点)。
log_format main_rt '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time urt=$upstream_response_time';

server {
    listen 80;
    listen [::]:80;
    server_name api.gomuseum.app;
    access_log /var/log/nginx/access.log main_rt;

    client_max_body_size 15m;  # 识别图片上传（后端限 10MB）

    location = /api/v1/recognize {
        limit_req zone=gomuseum_recog burst=50 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location ~ ^/api/v1/museums/[^/]+/recognize$ {
        limit_req zone=gomuseum_recog burst=50 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        limit_req zone=gomuseum_api burst=100 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
